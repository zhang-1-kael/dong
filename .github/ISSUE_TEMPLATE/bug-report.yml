name: Bug Report
description: 报告一个 bug。
title: "🐞 [标题]"
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题。请尽量把下面几项填完整，信息越全，修复越快。

  - type: textarea
    attributes:
      label: Bug 描述
      description: 清楚简洁地描述这个问题。
      placeholder: 问题的简要概述，以及它出现在什么场景下。
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 影响范围
      description: 问题出在哪个环节？
      options:
        - 壁纸导入（下载 / 转码 / 裁剪）
        - 播放与循环
        - 界面（菜单栏面板 / 壁纸库）
        - 多屏 / 显示器
        - 链接下载
        - 构建与打包
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      description: 列出复现这个问题的确切步骤。
      placeholder: |
        1. 第一步
        2. 第二步
        3. ……
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 复现频率
      description: 问题多久出现一次？
      options:
        - 每次必现
        - 经常（≥70%）
        - 有时（30–70%）
        - 偶尔（<30%）
        - 没能再次复现
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为 vs 实际行为
      description: |
        预期：我期望发生什么。

        实际：实际发生了什么，你认为原因是什么。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 录屏 / 截图
      description: 如果有，请附上录屏或截图帮助说明问题。
    validations:
      required: false

  - type: dropdown
    attributes:
      label: 严重程度
      description: 这个问题对你影响多大？
      options:
        - Blocker（完全无法使用）
        - Critical（主要功能损坏）
        - Major（有临时解决办法）
        - Minor（影响有限）
        - Trivial（仅外观）
    validations:
      required: true

  - type: input
    attributes:
      label: macOS 版本
      description:  → 苹果菜单 → 关于本机
      placeholder: Sequoia 15.5
    validations:
      required: true

  - type: input
    attributes:
      label: Dòng 版本
      description: 菜单栏面板 → 设置 → 关于
      placeholder: 3.18 (40)
    validations:
      required: true

  - type: textarea
    attributes:
      label: 补充信息
      description: 任何其他有帮助的信息。
      placeholder: |
        - 控制台日志或崩溃报告（请隐去敏感信息）
        - 相关 issue 编号
        - 是否使用了代理 / VPN
        - 外接显示器、扩展坞等硬件环境
